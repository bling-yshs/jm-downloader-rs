name: 🐳 构建并发布镜像 (Build and Push Image)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: 🐳 构建并发布镜像 (Build and Push Image)
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7

      - name: 准备 Rust 构建环境 (Setup Rust Build Environment)
        run: docker pull ghcr.io/rust-cross/cargo-zigbuild:latest

      - name: 配置 Docker Buildx (Setup Docker Buildx)
        uses: docker/setup-buildx-action@v4

      - name: 运行 build 构建 (Run Build)
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            ghcr.io/rust-cross/cargo-zigbuild:latest \
            cargo zigbuild --locked --release --target x86_64-unknown-linux-musl

      - name: 登录 GHCR (Login to GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布 latest 镜像 (Build and Push Latest Image)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/bling-yshs/jm-downloader-rs:latest
